name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # docs/phases.md §1.5: CI の Qt は 6.8 系 LTS に固定する。
  # ローカルが 6.11 でも CI は下限に合わせ、6.8 より後に入った API を
  # 無自覚に使う事故を CI で検出する。
  # 6.8 系の最新パッチ版は download.qt.io の索引で確認した（6.8.0〜6.8.3）。
  QT_VERSION: 6.8.3
  # docs/phases.md §1.5 と同じ理由でリンタも版を固定する。
  # ローカル開発機の Homebrew LLVM と同一版に合わせ、整形結果の食い違いを防ぐ。
  LLVM_VERSION: 22.1.8

jobs:
  build-and-test:
    name: ビルド + テスト (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            qt_arch: clang_64
          - label: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: MSVC 開発環境を設定
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja を導入
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            choco install ninja -y --no-progress
          fi
        shell: bash

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          # TIFF / WebP / JP2 / ICNS / TGA などのプラグインは qtbase ではなく
          # qtimageformats アドオンに入っている。既定ではインストールされないため明示する。
          # 入れないと能力表から該当形式が丸ごと消え、フィクスチャ生成が失敗する。
          modules: qtimageformats
          cache: true

      - name: 導入結果を確認
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          cmake --version
          ninja --version
        shell: bash

      - name: 構成
        run: cmake --preset dev

      - name: ビルド（警告ゼロ / -Werror・MSVC は /WX）
        run: cmake --build --preset dev

      # ────────────────────────────────────────────────────────────────
      # Phase 4 T1: 配布の前提を実測する。**一時的な手順である。**
      #
      # docs/progress/phase4.md の「推測で埋めた箇所」1〜4 を実測に置き換えるために
      # 置く。T7 で恒久の package ジョブを作るときに、この 2 ステップは削除する。
      #
      # 落ちても後続を止めない（continue-on-error）。これは計測であって検査ではなく、
      # ここで CI を赤くしても得るものが無い。**結果は必ず progress に記録する。**
      # ────────────────────────────────────────────────────────────────
      - name: T1 配布の前提を実測 (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "── (1) Qt のアーキテクチャ ── universal binary が組めるかを決める"
          lipo -archs "$QT_ROOT_DIR/lib/QtCore.framework/QtCore"
          echo
          echo "── (2) macdeployqt の署名・公証オプション ──"
          # 引数なしだと使い方を表示して exit 1 を返すため、パイプの前で握りつぶす。
          { "$QT_ROOT_DIR/bin/macdeployqt" 2>&1 || true; } \
            | grep -E 'codesign|hardened-runtime|timestamp|notarization|-dmg' \
            || echo "(該当するオプションが無い)"
          echo
          echo "── (5) 成果物の形 ── T2 で MACOSX_BUNDLE を明示した結果を確認する"
          ls -d build/dev/src/app/Katachi.app
          find build/dev/src/app/Katachi.app -type f
          echo
          echo "── 配布対象の下限（T2 で 13.0 を指定した）──"
          otool -l build/dev/src/app/Katachi.app/Contents/MacOS/Katachi \
            | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
          echo
          echo "── (6) release プリセット: universal と据え付け（T3）──"
          cmake --preset release > /dev/null
          cmake --build --preset release > /dev/null
          cmake --install build/release --prefix build/release/stage > /dev/null
          echo "アーキテクチャ:"
          lipo -archs build/release/stage/Katachi.app/Contents/MacOS/Katachi
          echo "据え付けた木:"
          find build/release/stage | sed 's|build/release/stage|<prefix>|'
        shell: bash

      - name: T1 配布の前提を実測 (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          echo "── (4) PE のサブシステム ── T2 で WIN32_EXECUTABLE を明示した結果"
          dumpbin -headers build/dev/src/app/Katachi.exe | grep -i subsystem || true
          echo
          echo "── バージョン資源が埋まっているか（T2 の .rc）──"
          dumpbin -headers build/dev/src/app/Katachi.exe | grep -i "resource" || true
          echo
          echo "── (3) windeployqt が何を配置するか ──"
          mkdir -p stage && cp build/dev/src/app/Katachi.exe stage/
          "$QT_ROOT_DIR/bin/windeployqt.exe" stage/Katachi.exe
          echo "-- 配置されたファイル --"
          find stage -type f | sort
          echo "-- 合計 --"
          find stage -type f | wc -l | xargs echo "ファイル数:"
          du -sh stage | awk '{print "大きさ:", $1}'
          echo
          echo "── (6) release プリセットの据え付け（T3）──"
          # **ローカルは macOS しかないため、Windows の据え付けはここが唯一の検証である。**
          cmake --preset release > /dev/null
          cmake --build --preset release > /dev/null
          cmake --install build/release --prefix build/release/stage > /dev/null
          echo "据え付けた木:"
          find build/release/stage | sed 's|build/release/stage|<prefix>|'
        shell: bash

      # docs/format-matrix.md はビルド時に生成され、内容は実行環境の Qt プラグイン構成で
      # 決まる（cmake/FormatMatrix.cmake）。OS ごとに何が使えるのかを推測で書かないため、
      # 両 OS の生成物をここで取り出す（Phase 3 T1）。
      # ビルド直後に置くのは、テストが落ちても対応表は入手したいため。
      - name: 対応フォーマット一覧を取り出す
        uses: actions/upload-artifact@v4
        with:
          name: format-matrix-${{ matrix.label }}
          path: docs/format-matrix.md
          if-no-files-found: error

      # 件数を名前に書かない。テストが増えるたびに古くなるため
      # （Phase 0 の「14 本 + smoke 2 本」が Phase 2 の時点で 142 本になっていた）。
      - name: テスト（ctest）
        run: ctest --preset dev --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: clang-format + clang-tidy (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # 上と同じ理由。qtimageformats を明示する。
          modules: qtimageformats
          cache: true

      - name: リンタを導入（版を固定）
        run: |
          python3 -m pip install --disable-pip-version-check \
            "clang-format==${LLVM_VERSION}" "clang-tidy==${LLVM_VERSION}"
          clang-format --version
          clang-tidy --version

      # clang-tidy は compile_commands.json を必要とするため、構成とビルドを先に行う。
      - name: 構成とビルド
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: clang-tidy
        run: clang-tidy -p build/dev $(git ls-files 'src/*.cpp')

  extra-codecs:
    name: 追加コーデック ON (macOS)
    runs-on: macos-14

    # ADR-0013 の 4 プラグイン（PSD / RAW / AVIF / JPEG XL）を実際にビルドして通す。
    # **macOS のみ。** Windows で ON を通すには libavif / libjxl / LibRaw / ECM を
    # vcpkg で用意する必要があり、Phase 3 のビルド基盤変更として大きすぎる。
    # 既定の OFF パスは build-and-test ジョブが両 OS で検証し続ける。
    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats
          cache: true

      # kimageformats はこれらを検出できたプラグインだけを作る。
      # pkgconf は libjxl の検出（pkg_check_modules）に要る。
      - name: コーデックライブラリを導入
        run: brew install libavif jpeg-xl libraw pkgconf

      # ECM と kimageformats は ExternalProject が固定タグで取得してビルドする。
      # **Qt 6.8.3 でビルドできるかはここで初めて確認される**（ローカルは 6.11.1）。
      - name: 構成とビルド（KATACHI_EXTRA_CODECS=ON）
        run: |
          cmake --preset dev-codecs
          cmake --build --preset dev-codecs

      - name: 対応フォーマット一覧を取り出す
        uses: actions/upload-artifact@v4
        with:
          name: format-matrix-macOS-codecs
          path: docs/format-matrix.md
          if-no-files-found: error

      - name: テスト
        run: ctest --preset dev-codecs --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  sanitizers:
    name: ASan + UBSan (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # 上と同じ理由。qtimageformats を明示する。
          modules: qtimageformats
          cache: true

      # docs/phases.md §3: ASan + UBSan の対象は macOS / Linux。Windows では動かさない。
      - name: 構成とビルド
        run: |
          cmake --preset asan
          cmake --build --preset asan

      - name: テスト
        run: ctest --preset asan --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
