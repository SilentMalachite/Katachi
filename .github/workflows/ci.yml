name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # docs/phases.md §1.5: CI の Qt は 6.8 系 LTS に固定する。
  # ローカルが 6.11 でも CI は下限に合わせ、6.8 より後に入った API を
  # 無自覚に使う事故を CI で検出する。
  # 6.8 系の最新パッチ版は download.qt.io の索引で確認した（6.8.0〜6.8.3）。
  QT_VERSION: 6.8.3
  # docs/phases.md §1.5 と同じ理由でリンタも版を固定する。
  # ローカル開発機の Homebrew LLVM と同一版に合わせ、整形結果の食い違いを防ぐ。
  LLVM_VERSION: 22.1.8

jobs:
  build-and-test:
    name: ビルド + テスト (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            qt_arch: clang_64
          - label: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    steps:
      - uses: actions/checkout@v4

      - name: MSVC 開発環境を設定
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja を導入
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            choco install ninja -y --no-progress
          fi
        shell: bash

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          # TIFF / WebP / JP2 / ICNS / TGA などのプラグインは qtbase ではなく
          # qtimageformats アドオンに入っている。既定ではインストールされないため明示する。
          # 入れないと能力表から該当形式が丸ごと消え、フィクスチャ生成が失敗する。
          modules: qtimageformats
          cache: true

      - name: 導入結果を確認
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          cmake --version
          ninja --version
        shell: bash

      - name: 構成
        run: cmake --preset dev

      - name: ビルド（警告ゼロ / -Werror・MSVC は /WX）
        run: cmake --build --preset dev

      # docs/format-matrix.md はビルド時に生成され、内容は実行環境の Qt プラグイン構成で
      # 決まる（cmake/FormatMatrix.cmake）。OS ごとに何が使えるのかを推測で書かないため、
      # 両 OS の生成物をここで取り出す（Phase 3 T1）。
      # ビルド直後に置くのは、テストが落ちても対応表は入手したいため。
      - name: 対応フォーマット一覧を取り出す
        uses: actions/upload-artifact@v4
        with:
          name: format-matrix-${{ matrix.label }}
          path: docs/format-matrix.md
          if-no-files-found: error

      # 件数を名前に書かない。テストが増えるたびに古くなるため
      # （Phase 0 の「14 本 + smoke 2 本」が Phase 2 の時点で 142 本になっていた）。
      - name: テスト（ctest）
        run: ctest --preset dev --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: clang-format + clang-tidy (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # 上と同じ理由。qtimageformats を明示する。
          modules: qtimageformats
          cache: true

      - name: リンタを導入（版を固定）
        run: |
          python3 -m pip install --disable-pip-version-check \
            "clang-format==${LLVM_VERSION}" "clang-tidy==${LLVM_VERSION}"
          clang-format --version
          clang-tidy --version

      # clang-tidy は compile_commands.json を必要とするため、構成とビルドを先に行う。
      - name: 構成とビルド
        run: |
          cmake --preset dev
          cmake --build --preset dev

      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')

      - name: clang-tidy
        run: clang-tidy -p build/dev $(git ls-files 'src/*.cpp')

  extra-codecs:
    name: 追加コーデック ON (macOS)
    runs-on: macos-14

    # ADR-0013 の 4 プラグイン（PSD / RAW / AVIF / JPEG XL）を実際にビルドして通す。
    # **macOS のみ。** Windows で ON を通すには libavif / libjxl / LibRaw / ECM を
    # vcpkg で用意する必要があり、Phase 3 のビルド基盤変更として大きすぎる。
    # 既定の OFF パスは build-and-test ジョブが両 OS で検証し続ける。
    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          modules: qtimageformats
          cache: true

      # kimageformats はこれらを検出できたプラグインだけを作る。
      # pkgconf は libjxl の検出（pkg_check_modules）に要る。
      - name: コーデックライブラリを導入
        run: brew install libavif jpeg-xl libraw pkgconf

      # ECM と kimageformats は ExternalProject が固定タグで取得してビルドする。
      # **Qt 6.8.3 でビルドできるかはここで初めて確認される**（ローカルは 6.11.1）。
      - name: 構成とビルド（KATACHI_EXTRA_CODECS=ON）
        run: |
          cmake --preset dev-codecs
          cmake --build --preset dev-codecs

      - name: 対応フォーマット一覧を取り出す
        uses: actions/upload-artifact@v4
        with:
          name: format-matrix-macOS-codecs
          path: docs/format-matrix.md
          if-no-files-found: error

      - name: テスト
        run: ctest --preset dev-codecs --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    name: 配布物 (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
            qt_arch: clang_64
          - label: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64

    # release プリセット（macOS は universal / KATACHI_PACKAGE=ON）を毎 PR で通す。
    # **「リリース時だけ通る構成」を作らないため**（ADR-0015 論点 3）。
    # 署名と公証はローカルでのみ行う（同 論点 4）。ここは未署名の成果物までを作る。
    steps:
      - uses: actions/checkout@v4

      - name: MSVC 開発環境を設定
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja を導入
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else choco install ninja -y --no-progress; fi
        shell: bash

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats
          cache: true

      # インストーラを実際に生成するために入れる（ADR-0015 論点 6）。
      # **無くてもジョブは通る**（PackageWindows.cmake が任意扱いにしている）。
      - name: Inno Setup を導入
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: 構成とビルド
        run: |
          cmake --preset release
          cmake --build --preset release

      # package.* は組み立てから検査まで（違反フィクスチャを含む）を行う。
      #
      # **正規表現に \ を使わない。** Windows の既定シェルは pwsh で、
      # bash と違い "\\." がそのまま ctest へ渡り 1 件も一致しなかった
      # （実測。ctest は「テストが 0 件」で非ゼロ終了するため気づけた）。
      # shell: bash も明示して、両 OS で同じ解釈にする。
      - name: 配布物の組み立てと機械検査
        run: ctest --preset release -R "^package" --output-on-failure
        shell: bash

      # **未署名である。** 配布してはならない（docs/release.md）。
      - name: 成果物を取り出す
        uses: actions/upload-artifact@v4
        with:
          name: katachi-unsigned-${{ matrix.label }}
          path: |
            build/release/Katachi-*.dmg
            build/release/Katachi-*.zip
            build/release/Katachi-*-setup.exe
          if-no-files-found: error

  sanitizers:
    name: ASan + UBSan (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Ninja を導入
        run: brew install ninja

      - name: Qt ${{ env.QT_VERSION }} を導入
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          # 上と同じ理由。qtimageformats を明示する。
          modules: qtimageformats
          cache: true

      # docs/phases.md §3: ASan + UBSan の対象は macOS / Linux。Windows では動かさない。
      - name: 構成とビルド
        run: |
          cmake --preset asan
          cmake --build --preset asan

      - name: テスト
        run: ctest --preset asan --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
